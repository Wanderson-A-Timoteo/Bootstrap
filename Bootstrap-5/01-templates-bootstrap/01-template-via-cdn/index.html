<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Bootstrap 5 - CDN</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .main-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>

  <div class="container main-container">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">

        <div class="mb-4">
          <i class="bi bi-bootstrap-fill text-primary" style="font-size: 4rem;"></i>
        </div>

        <h1 class="display-4 fw-bold">Bootstrap 5 <span class="text-primary">+</span> Icons</h1>
        <p class="lead">Este é um template configurado via CDN, pronto para o seu desenvolvimento no Windows 11 ou WSL
          2.</p>

        <hr class="my-4">

        <div class="d-flex justify-content-center gap-3">
          <button class="btn btn-primary btn-lg">
            <i class="bi bi-rocket-takeoff-fill me-2"></i> Começar Projeto
          </button>
          <a href="https://icons.getbootstrap.com/" target="_blank" class="btn btn-outline-dark btn-lg">
            <i class="bi bi-search me-2"></i> Ver Biblioteca de Ícones
          </a>
        </div>

        <div class="row mt-5">
          <div class="col-md-4">
            <i class="bi bi-lightning-charge text-warning fs-2"></i>
            <h3 class="h5 mt-2">Rápido</h3>
            <p class="small text-secondary">Carregamento via CDN otimizado.</p>
          </div>
          <div class="col-md-4">
            <i class="bi bi-shield-check text-success fs-2"></i>
            <h3 class="h5 mt-2">Seguro</h3>
            <p class="small text-secondary">Uso de hashes de integridade (SRI).</p>
          </div>
          <div class="col-md-4">
            <i class="bi bi-phone text-info fs-2"></i>
            <h3 class="h5 mt-2">Responsivo</h3>
            <p class="small text-secondary">Mobile-first por natureza.</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
